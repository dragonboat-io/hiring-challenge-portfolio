services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/app.db
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_REASONING_EFFORT: ${AZURE_OPENAI_REASONING_EFFORT:-none}
    volumes:
      # Named volume so the SQLite file survives a rebuild.
      - db:/data

volumes:
  db:
